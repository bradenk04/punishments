name: Public banlist packages
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['web-v*']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: web/go.sum
      - name: Verify dependencies and source formatting
        run: |
          go mod download
          test -z "$(gofmt -l *.go)"
      - name: Test public API and inspect code
        run: |
          go test -race ./...
          go vet ./...
      - name: Build standalone release binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="banlist-${os}-${arch}"
            suffix=''
            if [ "$os" = windows ]; then suffix='.exe'; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -ldflags='-s -w' -o "dist/${name}${suffix}" .
          done
          sha256sum dist/* > dist/SHA256SUMS
      - name: Build and save Docker image
        run: |
          docker build -t punishments-banlist:pr .
          docker save punishments-banlist:pr | gzip > dist/punishments-banlist-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: banlist-binaries-and-image
          path: web/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: banlist-formatted-source
          path: |
            web/*.go
            web/go.mod
            web/go.sum
          if-no-files-found: error
