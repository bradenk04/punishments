name: Shared database integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: punishments
          MYSQL_USER: punishments
          MYSQL_PASSWORD: punishments
          MYSQL_ROOT_PASSWORD: test-root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: punishments
          POSTGRES_USER: punishments
          POSTGRES_PASSWORD: punishments
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U punishments"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      MYSQL_JDBC: jdbc:mysql://localhost:3306/punishments
      POSTGRES_JDBC: jdbc:postgresql://localhost:5432/punishments
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: bash ./gradlew :common:test --tests '*ExternalDatabaseTest'
